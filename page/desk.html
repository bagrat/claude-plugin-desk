<title>{{DESK_TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, phone first. A sticky bar with the Desk's icon and its tabs (News
   first, only when there is news; the note box last, owner only), then the notes being sorted.
   It opens on News when there is some; Waiting shows one item at a time, in the order to do
   them, with one-tap answers. Colors: Frost below; the Desk's theme (THEMES) overrides them. */
:root {
  --bg: #eceff4; --card: #ffffff; --edge: #d8dee9; --fg: #2e3440; --muted: #4c566a; --quiet: #6b7385;
  --accent: #4c6f9a; --accent-ink: #ffffff; --decide: #8a5a99; --review: #4c6f9a; --check: #a0742a; --do: #4f7d3f;
  --chip-bg: #e5e9f0; --done: #6b7385; --new: #b4561f; --ok: #4f7d3f; --raise: #ffffff;
  --f-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #242933; --card: #2e3440; --edge: #3b4252; --fg: #eceff4; --muted: #c5cbd6; --quiet: #9aa3b2;
  --accent: #88c0d0; --accent-ink: #1f242c; --decide: #c9a3d4; --review: #88c0d0; --check: #ebcb8b; --do: #a3be8c;
  --chip-bg: #3b4252; --done: #9aa3b2; --new: #e5a27a; --ok: #a3be8c; --raise: #3b4252; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #242933; --card: #2e3440; --edge: #3b4252; --fg: #eceff4; --muted: #c5cbd6; --quiet: #9aa3b2;
  --accent: #88c0d0; --accent-ink: #1f242c; --decide: #c9a3d4; --review: #88c0d0; --check: #ebcb8b; --do: #a3be8c;
  --chip-bg: #3b4252; --done: #9aa3b2; --new: #e5a27a; --ok: #a3be8c; --raise: #3b4252; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* The header is one line: the Desk's icon, then the tabs, each an icon and maybe a count. */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--edge); display: flex; align-items: center; gap: 6px; height: 50px; }
.logo { flex: none; width: 30px; height: 30px; }
.logo { display: grid; place-items: center; border-radius: 8px; overflow: hidden; font: 700 15px var(--f-ui); line-height: 1; }
.logo.emoji { font-size: 22px; }
.logo.letter { background: var(--accent); color: var(--accent-ink); }
.logo img { width: 30px; height: 30px; object-fit: contain; display: block; }

/* The Inbox (rule 15): your notes waiting for the keeper, and the box to drop one (its own tab). */
.inbox { display: grid; gap: 8px; margin: 10px 0 4px; }
.strip { border: 1px solid var(--edge); border-radius: 12px; background: var(--chip-bg); font-size: 14px; }
.strip > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; color: var(--muted); font-weight: 600; }
.strip > summary::-webkit-details-marker { display: none; }
.strip .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .strip .pulse { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .35; } } }
.strip ul { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 6px; }
.strip li { display: grid; gap: 2px; padding-top: 6px; border-top: 1px solid var(--edge); }
.strip li span { color: var(--quiet); font-size: 12px; }
.note-box.answer textarea { min-height: 140px; background: var(--card); }
.note-box .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note-box input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.note-box .picked { font-size: 13px; color: var(--quiet); }
.stamp { margin: 24px 0 0; font-size: 12px; color: var(--quiet); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--edge); background: var(--card); color: var(--fg); font: 600 15px var(--f-ui); text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Tabs sized to their content, with the same space before the first as between them. */
.tabs { flex: 1; display: flex; justify-content: space-evenly; height: 100%; }
.tabs button { flex: none; padding: 0 8px; }
.tabs button { display: flex; align-items: center; justify-content: center; gap: 5px; height: 100%; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--quiet); cursor: pointer; }
.tabs button svg { width: 21px; height: 21px; flex: none; }
.tabs button b { font: 700 16px var(--f-ui); font-variant-numeric: tabular-nums; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* News: things to know, each cleared by Seen (rule 14). Its tab shows only when there is some. */
.ncard .rank { color: var(--new); display: grid; place-items: center; }
.ncard .rank svg { width: 17px; height: 17px; }
.ncard.leaving { opacity: 0; transform: translateX(24px); transition: opacity .18s, transform .18s; }
.seen-row { display: flex; justify-content: flex-end; }
.btn.seen { min-width: 120px; border-color: var(--ok); color: var(--ok); }
.btn.seen svg { width: 18px; height: 18px; }
.toast button { margin-left: 10px; border: 0; background: none; padding: 4px 2px; color: inherit; font: 700 14px var(--f-ui); text-decoration: underline; cursor: pointer; }
.mode { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 36px; padding: 0 12px; border: 0; background: var(--card); color: var(--muted); font: 600 13px var(--f-ui); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.later-note { font-size: 13px; color: var(--quiet); }
.later-note button { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }

h2 { margin: 20px 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet); text-wrap: balance; }
.list { display: grid; gap: 10px; }
.empty { padding: 14px 16px; border: 1px dashed var(--edge); border-radius: 12px; color: var(--quiet); }

.card, details.task { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; }
.card { touch-action: pan-y; }
/* The focus card and, while it is dragged, its neighbour sliding in beside it. */
/* It reaches past the side margins so a card slides off the screen edge, not the margin. */
.stage { position: relative; overflow: clip; margin-inline: -16px; padding-inline: 16px; }
.stage > .card { will-change: transform; }
.stage > .peek { position: absolute; top: 0; left: 16px; right: 16px; pointer-events: none; }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 14px 16px; }
details.task > summary { list-style: none; cursor: pointer; }
details.task > summary::-webkit-details-marker { display: none; }
.rank { grid-row: span 2; min-width: 30px; padding: 0 4px; box-sizing: border-box; height: 30px; border-radius: 50%; background: var(--chip-bg); color: var(--muted); font: 700 14px/30px var(--f-ui); text-align: center; font-variant-numeric: tabular-nums; }
.t-title { font-weight: 600; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--quiet); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip-bg); }
.k-decide { color: var(--decide); } .k-review { color: var(--review); } .k-check { color: var(--check); } .k-do { color: var(--do); } .k-info { color: var(--quiet); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--new); border: 1px solid currentColor; }
.badge.ok { color: var(--ok); }
.say { font-style: italic; }
.body { padding: 0 16px 16px 58px; display: grid; gap: 12px; min-width: 0; }
.body p { margin: 0; max-width: 65ch; }
.body ul { margin: 0; padding-left: 18px; max-width: 65ch; }
.field { display: grid; gap: 4px; }
.field > .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--quiet); }
.ask { padding: 10px 12px; border-radius: 10px; background: var(--chip-bg); font-weight: 500; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick .go { grid-column: 1 / -1; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.answered { padding: 8px 12px; border-left: 3px solid var(--ok); background: var(--chip-bg); border-radius: 0 10px 10px 0; font-size: 14px; }
.more > summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
.more[open] > summary { margin-bottom: 8px; }
.fold { border-top: 1px solid var(--edge); padding-top: 4px; }
.fold > summary::before { content: "▸"; margin-right: 8px; transition: transform .15s; }
.fold[open] > summary::before { transform: rotate(90deg); }
.id { font: 12px var(--f-mono); color: var(--quiet); }
/* What a card waits on: ✓ done, ◐ building, ○ open; a linked item opens its card. */
.deps { list-style: none; margin: 0; padding: 0 !important; display: grid; gap: 4px; }
.deps li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: baseline; }
.deps .mk { width: 16px; height: 16px; align-self: center; }
.deps .d-done .mk { color: var(--ok); } .deps .d-done .it { color: var(--quiet); }
.deps .d-building .mk { color: var(--accent); } .deps .d-open .mk { color: var(--quiet); }
.deps button.it { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.deps .d-done button.it { color: var(--quiet); }
/* An opened card clears the sticky bar. */
details.task, .row { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 60px); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; max-width: calc(100vw - 32px); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; text-align: center; }

/* One at a time: the answers and the arrows sit in a bar at the bottom, in reach of a thumb,
   so a long item never pushes them off screen. Sized for a 402pt-wide phone (iPhone 17). */
/* Floating, inset from the sides so the screen's rounded corners never clip a button. */
.dock { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px) * 0.35); z-index: 6; padding: 0 44px; pointer-events: none; }
.dock-in { max-width: 340px; margin: 0 auto; display: grid; gap: 8px; justify-items: center; }
.dock-row { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; pointer-events: auto; }
.dock-row .btn { padding: 0 6px; min-height: 46px; border-radius: 14px; background: var(--raise); border-color: color-mix(in srgb, var(--edge) 60%, var(--quiet)); box-shadow: 0 8px 22px rgba(0, 0, 0, .32), 0 1px 3px rgba(0, 0, 0, .22); }
.dock-row svg.i { width: 22px; height: 22px; }
/* ✓ is green, Later is yellow, the microphone stays plain. */
.btn.go { background: var(--raise); border-color: var(--ok); color: var(--ok); }
.btn.later { color: var(--check); }
.dock .sent { text-align: center; min-height: 0; padding: 4px 10px; border-radius: 999px; background: var(--card); box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.dock .sent:empty { display: none; }
body:has(#p-waiting:not([hidden]) .dock) .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px) * 0.35); }
body:has(#p-waiting:not([hidden]) .dock) .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px) * 0.35); }
.count { font-size: 13px; color: var(--quiet); font-variant-numeric: tabular-nums; margin: 4px 0 6px; }
/* The dashes stay pinned under the tabs while a card scrolls (2026-10-25). */
#p-waiting .count { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 50px); z-index: 4; background: var(--bg); margin: 0 0 6px; padding: 4px 0 2px; }
.dashes { display: flex; align-items: center; gap: 4px; }
.dash { flex: 1; min-width: 0; height: 22px; border: 0; padding: 0; background: none; position: relative; cursor: pointer; }
.dash::after { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--edge); }
.dash.on::after { background: var(--accent); }
.dash.new::before { content: ""; position: absolute; left: 0; top: 9px; width: 7px; height: 4px; border-radius: 2px; background: var(--new); z-index: 1; }
.later-n { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 2px 0 6px; border: 0; background: none; color: var(--check); font: 600 12px var(--f-ui); cursor: pointer; }
.later-n svg { width: 13px; height: 13px; }
.later-n.on { text-decoration: underline; }
/* The microphone: the item's name, big, to carry into the chat. */
.flash { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--accent); color: var(--accent-ink); }
.flash big { font: 700 34px/1.15 var(--f-ui); text-wrap: balance; }
.flash span { font-size: 16px; opacity: .85; }

.shots { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin-right: -16px; padding-right: 16px; }
.shot { flex: 0 0 auto; width: min(72%, 260px); scroll-snap-align: start; display: grid; gap: 4px; padding: 0; border: 0; background: none; color: var(--muted); font: 12px/1.35 var(--f-ui); text-align: left; cursor: zoom-in; }
.shot img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 10px; border: 1px solid var(--edge); background: var(--chip-bg); }
.lightbox { position: fixed; inset: 0; z-index: 20; background: #0f1218; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); gap: 10px; color: #eceff4; }
.lightbox .lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
.lightbox .lb-img { overflow: auto; display: grid; place-items: start center; }
.lightbox img { max-width: 100%; height: auto; border-radius: 8px; }
.lightbox .lb-nav { display: flex; justify-content: space-between; gap: 8px; }
.lightbox .btn { background: #2e3440; border-color: #3b4252; color: #eceff4; }
.answer { display: grid; gap: 8px; }
.answer textarea { box-sizing: border-box; width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--edge); background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-ui); }
.sent { font-size: 13px; color: var(--quiet); }

.row { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 16px; display: grid; gap: 4px; min-width: 0; }
.row .r-title { font-weight: 600; }
.row .r-note { color: var(--muted); font-size: 14px; max-width: 65ch; }
.row .r-note p { margin: 0; } .row .r-note ul { margin: 0; padding-left: 18px; }
.row.done .r-title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.when { font: 500 12px var(--f-mono); color: var(--quiet); }
footer { margin-top: 28px; font-size: 13px; color: var(--quiet); max-width: 65ch; }
@media (max-width: 480px) { .body { padding-left: 16px; } }
@media (prefers-reduced-motion: no-preference) {
  details.task[open] .body, .card.enter { animation: in .16s ease-out; }
  @keyframes in { from { opacity: .4; transform: translateY(-2px); } }
}
</style>

<div class="wrap">
  <header class="bar">
    <span class="logo letter" id="logo" role="img" aria-label="{{DESK_TITLE}}" title="{{DESK_TITLE}}"></span>
    <nav class="tabs" role="tablist" aria-label="Lists">
      <button role="tab" id="tab-news" data-tab="news" aria-label="News" hidden><b id="n-news">–</b></button>
      <button role="tab" id="tab-waiting" data-tab="waiting" aria-label="Waiting on you"><b id="n-waiting">–</b></button>
      <button role="tab" id="tab-working" data-tab="working" aria-label="In progress"><b id="n-working">–</b></button>
      <button role="tab" id="tab-scheduled" data-tab="scheduled" aria-label="Coming up"><b id="n-scheduled">–</b></button>
      <button role="tab" id="tab-all" data-tab="all" aria-label="Everything on one page"></button>
      <button role="tab" id="tab-note" data-tab="note" aria-label="Drop a note" hidden></button>
    </nav>
  </header>

  <section class="inbox" id="inbox" aria-label="Notes" hidden>
    <details class="strip" id="strip" hidden><summary><span class="pulse"></span><span id="strip-n"></span></summary><ul id="strip-l"></ul></details>
  </section>

  <section id="p-news" role="tabpanel" aria-labelledby="tab-news" hidden>
    <h2>News</h2><div class="list" id="l-news"></div>
  </section>
  <section id="p-waiting" role="tabpanel" aria-labelledby="tab-waiting">
    <div class="count" id="count">Loading the list…</div>
    <div id="l-waiting"></div>
  </section>
  <section id="p-working" role="tabpanel" aria-labelledby="tab-working" hidden>
    <h2>In progress</h2><div class="list" id="l-working"></div>
  </section>
  <section id="p-scheduled" role="tabpanel" aria-labelledby="tab-scheduled" hidden>
    <h2>Coming up</h2><div class="list" id="l-scheduled"></div>
  </section>
  <section id="p-all" role="tabpanel" aria-labelledby="tab-all" hidden>
    <div id="a-news-box" hidden><h2>News</h2><div class="list" id="a-news"></div></div>
    <h2>Waiting on you</h2><div class="list" id="a-waiting"></div>
    <h2>In progress</h2><div class="list" id="a-working"></div>
    <h2>Coming up</h2><div class="list" id="a-scheduled"></div>
    <p class="stamp" id="stamp"></p>
  </section>
  <section id="p-note" role="tabpanel" aria-labelledby="tab-note" hidden>
    <h2>Drop a note</h2>
    <div class="note-box answer" id="note-box">
      <textarea id="note-text" placeholder="An observation, a change you want: type or dictate…" aria-label="Your note"></textarea>
      <div class="row2">
        <button type="button" class="btn primary" id="note-send">Send to the keeper</button>
        <label class="btn" id="note-pick-l" for="note-pick">Add a screenshot</label><input type="file" id="note-pick" accept="image/*" multiple>
        <span class="picked" id="note-picked"></span>
      </div>
      <span class="sent" id="note-st"></span>
    </div>
  </section>

</div>

<script>
// This Desk, filled in when the page is made for it (desk.py page): its keeper's session.
const KEEPER = "{{DESK_KEEPER}}";
const DESK_LOOK = { theme: "{{DESK_THEME}}", icon: {{DESK_ICON}} };
// Icons (Lucide's shapes, picked 2026-10-24): tabs and the answer buttons.
const ICON = {
  news: '<path d="M9.94 15.5a2 2 0 0 0-1.44-1.44l-6.13-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0l1.58 6.14a2 2 0 0 0 1.44 1.44l6.14 1.58a.5.5 0 0 1 0 .96l-6.14 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/>',
  waiting: '<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  working: '<circle cx="3.2" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="10.4" cy="12" r="2.9" fill="currentColor" stroke="none"/><circle cx="19.2" cy="12" r="3.8" fill="currentColor" stroke="none"/>',

    // The anchor is read now, in the tap, before the save re-renders and replaces the card.

    ? { snoozeUntil: tomorrow9(), quick: "later", quickAt: at }

  fill($("a-waiting"), waitingAll.map(([id, t], i) => listCard(id, t, i + 1, "a")), "Nothing waits on you right now.");
  fill($("a-working"), workRows("aw"), "Nothing in progress.");
  fill($("a-scheduled"), schedRows(), "Nothing scheduled.");
  $("n-waiting").textContent = shown.length; $("n-working").textContent = working.length;
  $("n-scheduled").textContent = scheduled.length; 
  const latest = all.map(([, t]) => t.updatedAt).filter(Boolean).sort().pop();
  $("stamp").textContent = latest ? "Last changed " + when(latest) : "";

  const target = location.hash.startsWith("#t-") && location.hash.slice(3);
  if (target && !render.jumped && ui.rows[target]) {
    render.jumped = true;
    if (ui.rows[target].state === "news") { openCard(target); return; }
    setTab("waiting"); ui.focus = target; drawWaiting();
  }
}

(async () => {
  for (const b of document.querySelectorAll(".tabs button")) b.prepend(icon(b.dataset.tab));
  for (const b of document.querySelectorAll(".tabs button")) b.onclick = () => setTab(b.dataset.tab);
  $("p-waiting").addEventListener("wheel", onWheel, { passive: false });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !ui.backToTop) return;
    ui.backToTop = false; setTab(home()); if (ui.deck.length) advance(ui.deck[0]);
  });
  setTab(ui.tab);
  applyLook(null);
  const [d, u] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
  db = d ?? null; isOwner = (await u?.isOwner?.()) ?? false;
  cm = await window.claude?.use?.("comments") ?? null;
  if (!db) { $("count").textContent = "Open in claude.ai, signed in, to see the list"; return; }
  db.collection("settings").doc("look").onSnapshot((s) => applyLook(s.exists ? s.data() : null), () => {});
  db.collection("inbox").onSnapshot((snap) => drawInbox(snap.docs), () => {});
  if (isOwner) { assets = await window.claude?.use?.("assets").catch?.(() => null) ?? null; setupNoteBox(); }
  await loadSeen(u);
  let last = null;
  db.collection("tasks").onSnapshot((snap) => { last = snap.docs; render(last); }, () => { $("count").textContent = "The list stopped updating. Reload the page."; });
  // Later items come back on their own at 9:00 without a reload.
  setInterval(() => { if (last) render(last); }, 5 * 60e3);
})();
</script>
